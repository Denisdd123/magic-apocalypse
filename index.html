<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Magic Apocalypse" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>Magic Apocalypse 3.0 beta</title>
  <style>
    /* шрифты оригинала (те же файлы, что в style.css) */
    @font-face { font-family: "Noto Sans Display"; font-weight: 400 500; font-style: normal; font-display: swap; src: url("/fonts/NotoSansDisplay-Medium.woff2") format("woff2"); }
    @font-face { font-family: "Noto Sans Display"; font-weight: 600 800; font-style: normal; font-display: swap; src: url("/fonts/NotoSansDisplay-Bold.woff2") format("woff2"); }
    /* экран загрузки = сцена A_Loading оригинала (холст 720x1280, 1 px = --bu); убирает ui.ts, когда появляется меню */
    #boot { --bu: calc(min(100vw / 720, var(--app-h, 100lvh) / 1280)); position: fixed; inset: 0; z-index: 50; overflow: hidden; color: #f3efe7;
      background: linear-gradient(#36d8ff 0 60%, #000 60%); font-family: "Noto Sans Display", system-ui, sans-serif; transition: opacity 0.4s; }
    #boot.out { opacity: 0; pointer-events: none; }
    #boot .bcv { position: absolute; left: 50%; top: 50%; width: calc(var(--bu) * 720); height: calc(var(--bu) * 1280); transform: translate(-50%, -50%); }
    #boot .bl { position: absolute; left: 50%; top: 50%; display: block; transform: translate(-50%, -50%); user-select: none; pointer-events: none; }
    /* слои сзади вперёд: фон (.212,.847,1), LoadingImg5 (α .78), 4, 3, 2, 1; позиция (x,y вверх от центра), размер как в A_Loading */
    #boot .bl5 { left: calc(50% + var(--bu) * 90); top: calc(50% - var(--bu) * 415); width: calc(var(--bu) * 900); height: calc(var(--bu) * 450); opacity: 0.784; }
    #boot .bl4 { top: calc(50% + var(--bu) * 210); width: calc(var(--bu) * 720); height: calc(var(--bu) * 860); }
    #boot .bl3 { top: calc(50% + var(--bu) * 30); width: calc(var(--bu) * 720); height: calc(var(--bu) * 1220); }
    #boot .bl2 { top: calc(50% + var(--bu) * 100); width: calc(var(--bu) * 720); height: calc(var(--bu) * 1080); }
    #boot .bl1 { top: calc(50% + var(--bu) * 384); width: calc(var(--bu) * 720); height: calc(var(--bu) * 512); }
    #boot .boot-logo { position: absolute; left: calc(var(--bu) * 36); top: calc(var(--bu) * 64); transform: translateY(-50%); white-space: nowrap; font-weight: 700; font-size: calc(var(--bu) * 32); color: #000; letter-spacing: 1px; }
    /* полоса загрузки: (0,-430) 350x12, фон (.373), заливка (1,.882,.588) */
    #boot .boot-bar { position: absolute; left: calc(var(--bu) * 185); top: calc(var(--bu) * 1064); width: calc(var(--bu) * 350); height: calc(var(--bu) * 12); background: #5f5f5f; overflow: hidden; }
    #boot .boot-bar i { display: block; height: 100%; width: 0; background: #ffe196; transition: width 0.2s; }
    #boot .boot-txt { position: absolute; left: 0; top: calc(var(--bu) * 1090); width: 100%; text-align: center; font-size: max(11px, calc(var(--bu) * 22)); letter-spacing: 2px; text-transform: uppercase; color: #cfe9ee; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <div id="boot">
    <div class="bcv">
      <img class="bl bl5" src="art/ui/loading5.webp" alt="" />
      <div class="bl bl4" style="background:#1c7286;-webkit-mask:url(art/ui/loading4.webp) center/100% 100% no-repeat;mask:url(art/ui/loading4.webp) center/100% 100% no-repeat"></div>
      <div class="bl bl3" style="background:#134f5d;-webkit-mask:url(art/ui/loading3.webp) center/100% 100% no-repeat;mask:url(art/ui/loading3.webp) center/100% 100% no-repeat"></div>
      <div class="bl bl2" style="background:#0c3039;-webkit-mask:url(art/ui/loading2.webp) center/100% 100% no-repeat;mask:url(art/ui/loading2.webp) center/100% 100% no-repeat"></div>
      <div class="bl bl1" style="background:#000000;-webkit-mask:url(art/ui/loading1.webp) center/100% 100% no-repeat;mask:url(art/ui/loading1.webp) center/100% 100% no-repeat"></div>
      <div class="boot-logo">Magic Apocalypse</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-txt">Загрузка <span class="boot-pct"></span></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
