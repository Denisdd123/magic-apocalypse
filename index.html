<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Magic Apocalypse" />
  <meta name="theme-color" content="#7a8c55" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>Magic Apocalypse 2.0</title>
  <style>
    /* экран загрузки: виден, пока грузятся картинки 2.0; убирает ui.ts, когда появляется меню */
    #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at 50% 42%, #2a0d13 0%, #120709 45%, #050304 80%); color: #ece4d6;
      font-family: Georgia, "Palatino Linotype", "Times New Roman", serif; transition: opacity 0.4s; }
    #boot.out { opacity: 0; pointer-events: none; }
    #boot .boot-logo { font-size: 34px; line-height: 1; text-align: center; color: #e9dcc0; letter-spacing: 1px; }
    #boot .boot-logo b { display: inline-block; margin-left: 6px; padding: 1px 6px; font: 14px "Trebuchet MS", sans-serif; color: #fff; background: #7a1020; border: 1px solid #d0293d; border-radius: 3px; vertical-align: top; }
    #boot .boot-rune { width: 46px; height: 46px; border: 2px solid rgba(216,180,106,0.25); border-top-color: #d8b46a; border-radius: 50%; animation: bootspin 1s linear infinite; }
    #boot .boot-bar { width: min(220px, 60vw); height: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
    #boot .boot-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7a1020, #d8b46a); transition: width 0.2s; }
    #boot .boot-txt { font: 12px "Trebuchet MS", sans-serif; letter-spacing: 3px; text-transform: uppercase; color: #9a8f84; }
    @keyframes bootspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <div id="boot">
    <div class="boot-logo">Magic Apocalypse<b>2.0</b></div>
    <div class="boot-rune"></div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-txt">Загрузка <span class="boot-pct"></span></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
