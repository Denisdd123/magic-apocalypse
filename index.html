<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Magic Apocalypse" />
  <meta name="theme-color" content="#050405" />
  <!-- единый шрифт игры: Pixelify Sans (Google Fonts, OFL; латиница + кириллица), запасной — системный sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>Magic Apocalypse 2.0</title>
  <style>
    /* экран загрузки: виден, пока грузятся картинки 2.0; убирает ui.ts, когда появляется меню */
    #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at 50% 42%, #170a0d 0%, #0a0607 45%, #020202 80%); color: #f3efe7;
      font-family: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif; transition: opacity 0.4s; }
    #boot.out { opacity: 0; pointer-events: none; }
    #boot .boot-logo { font-size: min(34px, 7.2vw); max-width: 92vw; font-weight: 700; line-height: 1; text-align: center; color: #f3efe7; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; }
    #boot .boot-logo b { display: inline-block; margin-left: 6px; padding: 1px 6px; font-size: 14px; font-weight: 400; color: #fff; background: #7a1020; border: 1px solid #d0293d; border-radius: 3px; vertical-align: top; }
    #boot .boot-rune { width: 46px; height: 46px; border: 2px solid rgba(236,232,224,0.18); border-top-color: #f3efe7; border-radius: 50%; animation: bootspin 1s linear infinite; }
    #boot .boot-bar { width: min(220px, 60vw); height: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
    #boot .boot-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7a1020, #f3efe7); transition: width 0.2s; }
    #boot .boot-txt { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #9a8f84; }
    @keyframes bootspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <div id="boot">
    <div class="boot-logo">Magic Apocalypse<b>2.0</b></div>
    <div class="boot-rune"></div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-txt">Загрузка <span class="boot-pct"></span></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
